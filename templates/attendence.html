{% extends "base.html" %}

{% block content %}

<h1>Mark Attendance</h1>

<div class="panel">

    <div class="form-grid">

        <div>

            <label>Subject</label>

            <select id="subject">

                <option value="">
                    Select Subject
                </option>

                {% for subject in subjects %}

                <option value="{{ subject['id'] }}">
                    {{ subject['name'] }} ({{ subject['code'] }})
                </option>

                {% endfor %}

            </select>

        </div>

        <div>
            <label>Division</label>
            <select id="division" onchange="window.location.href = '/attendance?division=' + encodeURIComponent(this.value)">
                <option value="">All Divisions</option>
                {% for division in divisions %}
                <option value="{{ division['division'] }}" {% if division['division'] == selected_division %}selected{% endif %}>
                    Division {{ division['division'] }}
                </option>
                {% endfor %}
            </select>
        </div>


        <div>

            <label>Date</label>

            <input
                type="date"
                id="lecture-date"
                value="{{ today }}"
            >

        </div>


        <div>

            <label>Lecture Number</label>

            <input
                type="number"
                id="lecture-number"
                min="1"
                value="1"
            >

        </div>


        <div>

            <button
                class="btn primary"
                onclick="loadLecture()">

                Load Lecture

            </button>

        </div>

    </div>

</div>


<div id="attendance-area"
     class="panel hidden">

    <div class="attendance-header">

        <h2>Student Attendance</h2>

        <div>

            <button
                class="btn"
                onclick="markAll('P')">

                ✓ Mark All Present

            </button>

            <button
                class="btn"
                onclick="markAll('A')">

                ✕ Mark All Absent

            </button>

        </div>

    </div>


    <div id="lock-status"></div>


    <div class="table-wrapper">

        <table>

            <thead>

            <tr>

                <th>Roll</th>
                <th>PRN</th>
                <th>Name</th>
                <th>Status</th>

            </tr>

            </thead>

            <tbody id="attendance-body">

            {% for student in students %}

            <tr data-student-id="{{ student['id'] }}">

                <td>
                    {{ student['roll_no'] }}
                </td>

                <td>
                    {{ student['prn'] }}
                </td>

                <td>
                    {{ student['name'] }}
                </td>

                <td>

                    <button
                        type="button"
                        class="attendance-btn present"
                        data-status="P"
                        onclick="setStudentAttendance(this, 'P')">

                        Present

                    </button>

                    <button
                        type="button"
                        class="attendance-btn absent"
                        data-status="A"
                        onclick="setStudentAttendance(this, 'A')">

                        Absent

                    </button>

                </td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>


    <div class="attendance-actions">

        <button
            class="btn primary"
            onclick="saveAttendance()">

            Submit Attendance

        </button>

        <button
            class="btn"
            id="lock-lecture-button"
            disabled
            onclick="toggleLectureLock()">

            🔒 Lock / Unlock

        </button>

    </div>

</div>

{% endblock %}
